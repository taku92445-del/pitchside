<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pitchside">
</head>
<body>
<title>Pitchside チーム管理</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 左サイドバー＋スクロールするメイン（PC）／上部バー＋下部タブ（スマホ）。夜のピッチを思わせるダーク＋芝のグリーン。 */
:root{
  color-scheme: dark;
  --bg:#0a0f0d; --surface:#111815; --surface-2:#172019; --surface-3:#1d2822;
  --line:#222e28; --line-2:#2e3c35;
  --fg:#e5ede8; --muted:#8a9a92; --dim:#5d6c65;
  --accent:#36cf80; --accent-ink:#04200f; --accent-soft:rgba(54,207,128,.13);
  --warn:#efb444; --warn-soft:rgba(239,180,68,.13);
  --bad:#ff6a5c; --bad-soft:rgba(255,106,92,.13);
  --info:#6ea9ff; --info-soft:rgba(110,169,255,.13);
  --turf-1:#123d27; --turf-2:#0f3522; --chalk:rgba(232,244,236,.62); --opp:#ff6a5c;
  --gk:#efb444; --df:#6ea9ff; --mf:#36cf80; --fw:#ff6a5c;
  --display:"Barlow Condensed","Noto Sans JP",system-ui,sans-serif;
  --body:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;
  --ease:cubic-bezier(.22,.7,.18,1);
  --shadow:0 10px 30px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.topbar,.tabbar{display:none}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--display);font-size:22px;letter-spacing:.06em;font-weight:700}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:-4px}
.nav{display:flex;flex-direction:column;gap:2px}
body.cloud [data-role],body.cloud .side-foot .role,body.cloud #resetBtn{display:none!important}
body.gated{overflow:hidden}body.gated #app,body.gated #tabbar{visibility:hidden}
#gate{position:fixed;inset:0;z-index:200;overflow-y:auto;background:var(--bg);padding:max(28px,env(safe-area-inset-top)) 16px 40px}
#gate[hidden]{display:none}
.gbox{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gbrand{display:flex;align-items:center;gap:10px;margin:8px 0 14px}.gbrand b{font-family:var(--display);font-size:24px;letter-spacing:.08em}
.gbox h1{font-size:22px;margin:4px 0 0}
.gmsg{font-size:13.5px;color:var(--muted);line-height:1.7}
.glink{border:0;background:none;color:var(--accent);font:inherit;font-size:13.5px;padding:6px 0;text-align:left;cursor:pointer}.glink.back{color:var(--muted)}
.gor{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin:10px 0 2px}.gor::before,.gor::after{content:"";flex:1;height:1px;background:var(--line)}
.gcard{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line-2);background:var(--surface);color:inherit;font:inherit;border-radius:14px;padding:14px 16px;cursor:pointer}
.gcard b{font-size:15px}.gcard span{font-size:12.5px;color:var(--muted);line-height:1.6}.gcard:hover{border-color:var(--accent)}
.gload{display:flex;align-items:center;gap:12px;color:var(--muted);padding:40px 0}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.acct{display:flex;flex-direction:column;gap:3px;padding:10px 2px 0;font-size:12.5px}.acct b{font-size:13.5px}.acct>span{color:var(--muted)}.acct .btn{align-self:flex-start;margin-top:6px}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--accent);vertical-align:1px}.sync.saving::before{background:var(--warn)}.sync.err::before,.sync.off::before{background:var(--bad)}
.balrow{display:flex;flex-wrap:wrap;gap:6px}.balrow span{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--surface-3);color:var(--dim);font-size:13px;font-weight:600}.balrow span.on{background:var(--accent-soft);color:var(--accent)}
.lref{display:flex;flex-direction:column}.lr{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.lr:first-child{border-top:0}
.composer.ro{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);line-height:1.6}
.gbanner{display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:13px;font-weight:600;margin-bottom:14px}
.bell{position:relative;border:0;background:transparent;color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}.bell:hover{background:var(--surface-2);color:var(--fg)}
.bell .bdot{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.bell.side{width:auto;height:auto;display:flex;gap:10px;justify-content:flex-start;padding:9px 12px;margin:2px 0 8px;font:inherit;font-size:14px;color:var(--muted)}.bell.side .bdot{position:static;margin-left:auto}
.topbar .bell{margin-left:auto}
.nsec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--dim);padding:14px 12px 4px}
.nsec:first-child{padding-top:2px}
.msec{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin:18px 0 8px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mbtn{display:flex;align-items:center;gap:12px;text-align:left;color:inherit;font:inherit;cursor:pointer;padding:14px 16px;position:relative}
.mbtn .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.mbtn b{display:block;font-size:14.5px}.mbtn .grow>span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.mbtn .grow{flex:1;min-width:0}.mbtn>.ic{color:var(--dim);flex:none}.mbtn .dotb{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}

.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left;font-weight:500;transition:background .22s var(--ease),color .22s var(--ease)}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-family:var(--display);font-weight:700;font-size:13px;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#1b0503;display:grid;place-items:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.role select{width:100%}
.reset{border:1px dashed var(--line-2);background:transparent;color:var(--dim);font-size:12px;padding:7px 10px;border-radius:8px;transition:color .2s,border-color .2s}
.reset:hover{color:var(--muted);border-color:var(--muted)}
.reset.arm{color:var(--bad);border-color:var(--bad)}

.main{overflow-y:auto;overscroll-behavior:contain;position:relative}
.view{max-width:1180px;margin:0 auto;padding-block:30px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:821px){.view{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.view.enter{animation:viewIn .34s var(--ease) both}
@keyframes viewIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- page head ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;position:relative}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;color:var(--accent);font-size:14px}
.head h1{margin:2px 0 0;font-size:26px;line-height:1.3;font-weight:700;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.head-pitch{position:absolute;right:0;top:-14px;width:220px;height:90px;opacity:.5;pointer-events:none}

/* ---------- primitives ---------- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}
@media (max-width:1020px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--muted)}
.hov{transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .28s var(--ease)}
.hov:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}

.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:22px;color:var(--muted);font-weight:600}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.good .v{color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);padding:8px 14px;border-radius:10px;font-weight:500;font-size:13px;transition:background .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease);white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--muted)}
.btn:active{transform:scale(.97)}
a.btn{text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:rgba(255,106,92,.35);background:transparent}
.btn.danger.arm{background:var(--bad);color:#1b0503}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap;line-height:1.7}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pos{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:12px;padding:1px 7px;border-radius:5px;border:1px solid currentColor;line-height:1.5}
.pos.GK{color:var(--gk)}.pos.DF{color:var(--df)}.pos.MF{color:var(--mf)}.pos.FW{color:var(--fw)}
.num{font-family:var(--display);font-weight:700;font-size:21px;width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.num.GK{color:var(--gk)}.num.DF{color:var(--df)}.num.MF{color:var(--mf)}.num.FW{color:var(--fw)}
.num.lg{width:60px;height:60px;font-size:32px;border-radius:14px}

input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:72px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.7)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--dim)}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.form .two{grid-template-columns:minmax(0,1fr)}}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--line-2) var(--p,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--fg);border:4px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .15s var(--ease)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:4px solid var(--accent)}
input[type=range].staff{background:linear-gradient(to right,var(--info) var(--p,50%),var(--line-2) var(--p,50%))}
input[type=range].staff::-webkit-slider-thumb{border-color:var(--info)}

.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;transition:background .22s var(--ease),color .22s var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.seg button.on.present{background:var(--accent-soft);color:var(--accent)}
.seg button.on.late{background:var(--warn-soft);color:var(--warn)}
.seg button.on.absent{background:var(--bad-soft);color:var(--bad)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;font-size:12.5px;transition:all .2s var(--ease)}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.list{display:flex;flex-direction:column}
.list>.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list>.it:first-child{border-top:0;padding-top:2px}
.it .grow{flex:1;min-width:0}
.it .nm{font-weight:700;font-size:14px}
.it .meta{font-size:12px;color:var(--muted)}
.empty{color:var(--dim);font-size:13px;padding:14px 0;text-align:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{position:relative;flex:1 1 220px;max-width:340px}
.toolbar .search input{padding-left:36px}
.toolbar .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .5s var(--ease)}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)} .bar.info>i{background:var(--info)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--warn)} .dots.bad i.on{background:var(--bad)}

/* ---------- roster ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pcard{cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit;display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;gap:12px;align-items:center}
.pcard .nm{font-weight:700;font-size:15.5px}
.pcard .kana{font-size:11px;color:var(--dim)}
.pcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.pcard dt{color:var(--dim)} .pcard dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .flags{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}

/* ---------- attendance ---------- */
.att-row{display:grid;grid-template-columns:42px minmax(120px,1fr) auto 70px minmax(140px,1.1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.att-row .who{min-width:0}
.att-row .who b{display:block;font-size:14px}
.att-row .mlate{font-family:var(--display);font-weight:700;font-size:15px;text-align:center;border-radius:8px;padding:2px 0}
.att-row .mlate.warn{color:var(--warn);background:var(--warn-soft)} .att-row .mlate.bad{color:var(--bad);background:var(--bad-soft)} .att-row .mlate.ok{color:var(--dim)}
.att-row input{padding:7px 10px;font-size:12.5px}
@media (max-width:760px){
  .att-row{grid-template-columns:42px minmax(0,1fr) 56px;row-gap:8px}
  .att-row .seg{grid-column:1/-1;justify-self:start}
  .att-row .note{grid-column:1/-1}
  .att-row .mlate{grid-column:3;grid-row:1}
}
.datebar{display:flex;align-items:center;gap:6px}
.datebar input{width:auto}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted);transition:all .2s var(--ease)}
.iconbtn:hover{color:var(--fg);border-color:var(--muted)}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.offnote{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}


/* attendance tiles: 1画面で全員を一覧 */
.atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.at{background-color:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .25s var(--ease),background-image .25s var(--ease)}
.at.present{border-color:rgba(54,207,128,.45)}
.at.late{border-color:rgba(239,180,68,.6);background-image:linear-gradient(var(--warn-soft),var(--warn-soft))}
.at.absent{border-color:rgba(255,106,92,.5);background-image:linear-gradient(var(--bad-soft),var(--bad-soft))}
.at.none{border-style:dashed}
.at-top{display:flex;align-items:center;gap:9px}
.at .num{width:36px;height:36px;font-size:18px;border-radius:9px}
.at-who{flex:1;min-width:0;line-height:1.35}

/* ---------- tactics board ---------- */
.tac-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

.pitch-card{display:flex;flex-direction:column;gap:12px}

.pitch-tools .field{flex:1 1 130px}

.pitch{position:relative;width:100%;max-width:440px;margin:4px auto 18px;aspect-ratio:68/105;border-radius:10px;container-type:inline-size;background:repeating-linear-gradient(to bottom,var(--turf-1) 0 10%,var(--turf-2) 10% 20%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
.pitch>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;width:9.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:grab;z-index:2;transition:left .6s var(--ease),top .6s var(--ease),opacity .35s var(--ease),transform .25s var(--ease),box-shadow .2s var(--ease)}
.mk b{font-family:var(--display);font-weight:700;font-size:4.4cqw;line-height:1;font-variant-numeric:tabular-nums}
.mk small{position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);font-size:max(9px,2.7cqw);font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95);pointer-events:none}
.mk.own{background:var(--accent);color:var(--accent-ink);border:2px solid rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.mk.opp{width:8.2%;background:var(--opp);color:#fff;border:2px solid rgba(0,0,0,.35);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.mk.opp b{font-size:3.2cqw;letter-spacing:.02em}
.mk.inj::after{content:"";position:absolute;top:-3px;right:-3px;width:30%;height:30%;border-radius:50%;background:var(--warn);border:2px solid var(--turf-2)}
.mk.sel{box-shadow:0 0 0 3px var(--turf-2),0 0 0 5px #fff}
.mk.dragging{transition:opacity .35s,box-shadow .2s;transform:translate(-50%,-50%) scale(1.18);z-index:5;cursor:grabbing}
.mk.ball{width:5.6%;z-index:6;background:#f4f7f5;border:0;box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 0 1.5px rgba(0,0,0,.35)}
.mk.ball svg{width:100%;height:100%;display:block}
.mk.ball.dragging{transform:translate(-50%,-50%) scale(1.3)}
.pitch.ro .mk{cursor:default}
.pitch>svg.arrows{z-index:1;overflow:visible}
.ar{fill:none;stroke-width:.62;stroke-linecap:round;transition:opacity .35s var(--ease)}
.ar.run{stroke:#f4f7f5}
.ar.pass{stroke:var(--warn);stroke-dasharray:1.6 1.2;animation:flow 1.2s linear infinite}
.ar.opp{stroke:var(--opp)}
.ar.prev{opacity:.6}
@keyframes flow{to{stroke-dashoffset:-2.8}}
.pitch.draw{cursor:crosshair}
.pitch.draw .mk{cursor:crosshair}
.arhit{fill:none;stroke:transparent;stroke-width:3.4;pointer-events:stroke;cursor:pointer}
.pitch.ro .arhit{pointer-events:none}
.ar.sel{stroke-width:1;filter:drop-shadow(0 0 .8px rgba(255,255,255,.9))}
.pitch.erase{cursor:default}
.pitch.erase .ar{opacity:.9}
.btn.on-erase{background:var(--bad);color:#1b0503;border-color:var(--bad);font-weight:700}

.tools-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

V.attendance=()=>isStaff()?attStaff():attPlayer();
function attStaff(){
  const d=ui.attDate,a=S.att[d]||{},t=sessType(d),ps=sorted(),L=S.settings.lateLimit;
  const cnt={present:0,late:0,absent:0};ps.forEach(p=>{if(a[p.id])cnt[a[p.id].s]++});
  const none=ps.length-cnt.present-cnt.late-cnt.absent;
  const tile=p=>{
    const r=a[p.id],n=lateCount(p.id),c=condOf(p.id,d),inj=activeInj(p.id),lv=lateLv(n);
    let info='';
    if(inj){const left=diff(TODAY,inj.ret);info+=`<span class="pill warn" title="${esc(inj.part)}">${ic('alert',11)}${left>=0?`離脱 あと${left}日`:`復帰予定を${-left}日超過`}</span>`}
    if(c)info+=c.sick?`<span class="pill bad" title="${canSee(p,'condNote')?esc(c.note):''}">病欠</span>`:`<span class="pill ${scoreCls(c.v)}" title="${canSee(p,'condNote')?esc(c.note):''}">体調 ${SCORE[c.v]}</span>`;
    else info+='<span class="pill">体調 未提出</span>';
    S.events.filter(e=>e.date===d&&e.ask&&(e.sq==='club'||e.sq===p.squad)).forEach(e=>{const r=rsOf(e.id,p.id);if(r&&r.a!=='yes')info+=`<span class="pill ${RS[r.a][1]}" title="${esc(e.title)}">事前：${RS[r.a][0]}${r.note?'（'+esc(r.note)+'）':''}</span>`});
    if(inj&&inj.cc)info+=`<span class="pill bad">${ic('brain',11)}脳しんとう ${inj.ccStep||0}/6</span>`;
    const lf=lifeOf(p.id,d),sh=canSee(p,'sleep')?sleepH(lf):null;if(sh!=null&&sh<6)info+=`<span class="pill warn">睡眠 ${sh}時間</span>`;if(canSee(p,'meals')&&lf&&lf.meals&&!lf.meals.b)info+='<span class="pill bad">朝食なし</span>';
    return `<div class="at ${r?r.s:'none'}">
      <div class="at-top">${numB(p)}<div class="at-who"><b>${esc(p.name)}</b><span>${ui.squad==='all'?`<span class="sqtag ${p.squad}">${p.squad}</span> `:''}${p.pos} ・ <em class="lt ${lv}">遅刻 ${n}/${L}</em></span></div><button class="iconbtn ${r&&r.note?'has':''}" data-a="noteT" aria-label="${esc(p.name)}の補足を書く">${ic('edit',14)}</button></div>
      <div class="at-info">${info}</div>
      ${c&&c.note&&(c.sick||c.v<=2)&&canSee(p,'condNote')?`<div class="at-cnote">${esc(c.note)}</div>`:''}
      <div class="seg" role="group" aria-label="${esc(p.name)}の出欠">${['present','late','absent'].map(s=>`<button class="${s} ${r&&r.s===s?'on':''}" data-a="att" data-id="${p.id}" data-s="${s}" aria-pressed="${!!(r&&r.s===s)}">${ST[s]}</button>`).join('')}</div>
      <div class="at-note" ${r&&r.note?'':'hidden'}><input type="text" data-note="${p.id}" value="${esc(r?r.note:'')}" placeholder="理由・補足" aria-label="${esc(p.name)}の補足"></div>
    </div>`;
  };
  return `<div class="head" style="margin-bottom:14px"><div><div class="eyebrow">${d===TODAY?'今日':jp(d)} ・ ${t}</div><h1>出欠・遅刻管理</h1></div></div>
  <div class="toolbar">
    <div class="datebar"><button class="iconbtn" data-a="day" data-d="-1" aria-label="前の日">${ic('left',16)}</button><input type="date" id="attDate" value="${d}" aria-label="日付"><button class="iconbtn" data-a="day" data-d="1" aria-label="次の日">${ic('right',16)}</button></div>
    <select id="sessType" style="width:auto" aria-label="活動の種類">${['練習','試合','オフ'].map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('')}</select>
    <button class="btn" data-a="allPresent">未入力を全員出席</button>
    <label class="limit" for="lateLimit">面談ライン 月<input type="number" id="lateLimit" min="1" max="10" value="${L}">回</label>
    <div class="summary" style="margin-left:auto"><span class="pill good tnum">出席 ${cnt.present}</span><span class="pill warn tnum">遅刻 ${cnt.late}</span><span class="pill bad tnum">欠席 ${cnt.absent}</span><span class="pill tnum">未入力 ${none}</span></div>
  </div>
  ${d===TODAY?heatCard():''}
  ${t==='オフ'?'<div class="offnote">この日はオフに設定されています。自主練などを記録する場合だけ入力してください。</div>':''}

/* ============ sleep / meals / weight ============ */
const MEAL=[['b','朝','朝食'],['l','昼','昼食'],['d','夕','夕食'],['s','補','補食']];
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const fmtMin=m=>{m=((m%1440)+1440)%1440;return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
function sleepH(e){if(!e)return null;const b=toMin(e.bed),w=toMin(e.wake);if(b==null||w==null)return null;let x=w-b;if(x<=0)x+=1440;return Math.round(x/6)/10}
const lifeOf=(pid,d=TODAY)=>S.life[d]&&S.life[d][pid];
function weights(pid,days){const out=[];for(let k=-(days-1);k<=0;k++){const d=addDays(TODAY,k),e=lifeOf(pid,d);if(e&&e.wt)out.push({k,d,w:e.wt})}return out}
function wtChange(pid){const w=weights(pid,14);if(w.length<2)return null;const a=w[0].w,b=w[w.length-1].w;return {kg:Math.round((b-a)*10)/10,pct:Math.round((b-a)/a*1000)/10}}
function avgSleep(pid,days=7){const v=[];for(let k=-(days-1);k<=0;k++){const h=sleepH(lifeOf(pid,addDays(TODAY,k)));if(h!=null)v.push(h)}return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null}
function seedLife(){
  const R=rng(777),life={},base={};
  S.players.forEach((p,i)=>base[p.id]=Math.round(((isF(p)?47+((i*37)%10):57+((i*37)%17))+R()*2)*10)/10);
  for(let k=-29;k<=0;k++){const d=addDays(TODAY,k);life[d]={};
    S.players.forEach(p=>{
      if(k===0&&(p.id==='p2'||p.id==='p12'))return;
      const night=p.id==='p13'||p.id==='p8';
      const bed=night?24*60+20+Math.floor(R()*50):23*60+Math.floor(R()*65),wake=6*60+Math.floor(R()*35);
      const e={bed:fmtMin(bed),wake:fmtMin(wake),sq:night?2+Math.floor(R()*2):3+Math.floor(R()*3),meals:{b:!(night&&R()<.45)&&R()>.04,l:true,d:true,s:R()<.6},note:''};
      if(p.id==='p11'&&k>=-1){e.sq=2;e.meals={b:k<0,l:false,d:true,s:false};e.note='熱があって食欲がない。ゼリーとスポーツドリンクだけ'}
      if(k===0&&p.id==='p10')e.note='朝：おにぎり2個、卵焼き、バナナ／補食：練習前にカステラ';
      if(k===0&&p.id==='p13'){e.meals.b=false;e.note='寝坊して朝ごはんを食べられなかった'}
      if(k%3===0||k===-1){let w=base[p.id]+(R()-.5)*.6;if(p.id==='p14')w=base[p.id]+(29+k)*.09;if(p.id==='p11'&&k>=-1)w=base[p.id]-2.4;e.wt=Math.round(w*10)/10}
      life[d][p.id]=e;
    });
  }
  return life;
}
function sleepChart(pid,days=14){
  const W=320,H=130,L=22,B=18,T=8,bw=(W-L-4)/days,y=h=>H-B-(Math.min(h,10)/10)*(H-B-T);
  let bars='';for(let i=0;i<days;i++){const d=addDays(TODAY,i-days+1),h=sleepH(lifeOf(pid,d));if(h==null)continue;const x=L+i*bw+bw*.18,w=bw*.64;bars+=`<rect x="${x.toFixed(1)}" y="${y(h).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-B-y(h)).toFixed(1)}" rx="2" fill="${h<6?'var(--warn)':'var(--accent)'}" opacity="${i===days-1?1:.8}"><title>${jp(d)} ${h}時間</title></rect>`}

function weightChart(pid,days=30){

  const W=320,H=130,L=34,B=18,T=12;let mn=Math.min(...pts.map(p=>p.w)),mx=Math.max(...pts.map(p=>p.w));const c=(mn+mx)/2,half=Math.max(1,(mx-mn)/2+.4);mn=c-half;mx=c+half;
  const x=k=>L+(k+days-1)/(days-1)*(W-L-10),y=w=>T+(mx-w)/(mx-mn)*(H-B-T);
  const path=pts.map((p,i)=>(i?'L':'M')+x(p.k).toFixed(1)+' '+y(p.w).toFixed(1)).join(''),last=pts[pts.length-1];

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${days}日の体重">${ticks}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${x(p.k)}" cy="${y(p.w)}" r="${p===last?4:2.5}" fill="${p===last?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"><title>${jp(p.d)} ${p.w}kg</title></circle>`).join('')}<text x="${L}" y="${H-4}">${jp(addDays(TODAY,-days+1))}</text><text x="${W-4}" y="${H-4}" text-anchor="end">今日</text></svg>`;
}

function equivHtml(rp,rc,title){

    <div><div class="lbl" style="margin-bottom:6px;color:var(--accent)">たんぱく質 ${Math.round(rp)}g をとるには</div>${rp>0?row(EQP,rp,'var(--accent)'):'<div class="pill good">目標に届いています</div>'}</div>

  if(f.id==='medForm'){me().med=readMed();save();closeDrawer();render(false);toast('アレルギー・医療の情報を保存しました')}
  if(f.id==='mForm'){const opp=$('#gOpp').value.trim(),date=$('#gDate').value,err=$('#gErr');
    if(!opp||!date){err.textContent='日付と対戦相手を入力してください';err.hidden=false;return}
    const n=v=>v===''?null:Math.max(0,parseInt(v)||0);const data={squad:$('#gSq').value,half:Math.max(5,Math.min(60,parseInt($('#gHalf').value)||defHalf($('#gSq').value))),date,comp:$('#gComp').value,opp,venue:$('#gVenue').value.trim(),gf:n($('#gGf').value),ga:n($('#gGa').value)};
    let id=f.dataset.id;if(id)Object.assign(S.matches.find(m=>m.id===id),data);else{id=uid();S.matches.push(Object.assign({id,memos:[],summary:''},data))}
    save();closeDrawer();ui.view='matches';ui.match=id;render(true);toast('試合を保存しました')}
  if(f.id==='iForm'){const part=$('#iPart').value.trim(),s=$('#iStart').value,r=$('#iRet').value,err=$('#iErr');
    if(!part||!s||!r){err.textContent='部位・受傷日・復帰予定日を入力してください';err.hidden=false;return}
    if(r<s){err.textContent='復帰予定日は受傷日より後の日付にしてください';err.hidden=false;return}
    const data={pid:$('#iP').value,part,detail:$('#iDetail').value.trim(),start:s,ret:r,cc:$('#iCc').checked};
    if(f.dataset.id)Object.assign(S.injuries.find(x=>x.id===f.dataset.id),data);else S.injuries.push(Object.assign({id:uid(),status:'active'},data));
    save();closeDrawer();render(false);toast('怪我の記録を保存しました')}
});
let drawA=null;
function snapPt(x,y){const pl=curPlan();let best=null,bd=5;[...pl.own,...pl.opp,pl.ball].forEach(m=>{const d=Math.hypot((m.x-x)*.68,(m.y-y)*1.05);if(d<bd){bd=d;best=m}});return best?{x:best.x,y:best.y}:{x,y}}
document.addEventListener('pointerdown',e=>{if(!isStaff()||ui.view!=='tactics')return;const pitch=e.target.closest('#pitch');if(!pitch)return;
  if(e.target.closest('.ardel'))return;
  const hit=e.target.closest('.arhit');
  if(hit&&ui.tool==='erase'){e.preventDefault();e.stopPropagation();curPlan().arrows.splice(+hit.dataset.ai,1);save();applyPlan();toast('矢印を消しました');return}
  if(hit){e.preventDefault();e.stopPropagation();const i=+hit.dataset.ai;ui.arSel=ui.arSel===i?null:i;applyPlan();return}
  if(ui.arSel!=null){ui.arSel=null;applyPlan()}
  if(ui.tool==='move'||ui.tool==='erase')return;
  const onMk=e.target.closest('.mk');
  if(e.pointerType!=='mouse'&&!onMk)return;
  e.preventDefault();e.stopPropagation();
  const r=pitch.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;const st=snapPt(x,y);
  drawA={r,x1:st.x,y1:st.y,x2:st.x,y2:st.y};try{pitch.setPointerCapture(e.pointerId)}catch(_){}},true);
document.addEventListener('pointermove',e=>{if(!drawA)return;const r=drawA.r;drawA.x2=Math.min(99,Math.max(1,(e.clientX-r.left)/r.width*100));drawA.y2=Math.min(99,Math.max(1,(e.clientY-r.top)/r.height*100));
  const pv=$('#arPrev');if(pv){pv.setAttribute('d',arPath(Object.assign({type:ui.tool},drawA)));pv.setAttribute('class','ar prev '+ui.tool);pv.setAttribute('marker-end',`url(#ah-${ui.tool})`)}});
const endDraw=()=>{if(!drawA)return;const a=drawA;drawA=null;const pv=$('#arPrev');if(pv)pv.setAttribute('d','');
  if(Math.hypot((a.x2-a.x1)*.68,(a.y2-a.y1)*1.05)<3)return;const en=ui.tool==='pass'?snapPt(a.x2,a.y2):{x:a.x2,y:a.y2};
  const pl=curPlan();pl.arrows.push({type:ui.tool,x1:a.x1,y1:a.y1,x2:Math.round(en.x*10)/10,y2:Math.round(en.y*10)/10});save();applyPlan()};
document.addEventListener('pointerup',endDraw);document.addEventListener('pointercancel',endDraw);
let drag=null;
document.addEventListener('pointerdown',e=>{const m=e.target.closest('.mk');if(!m||!isStaff()||ui.tool!=='move')return;const pitch=$('#pitch');if(!pitch)return;e.preventDefault();
  drag={m,rect:pitch.getBoundingClientRect(),side:m.dataset.side,i:+m.dataset.i,sx:e.clientX,sy:e.clientY,moved:false,x:null,y:null};try{m.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;
  if(!drag.moved){drag.moved=true;drag.m.classList.add('dragging')}
  const r=drag.rect;drag.x=Math.min(97,Math.max(3,(e.clientX-r.left)/r.width*100));drag.y=Math.min(98,Math.max(2,(e.clientY-r.top)/r.height*100));
  drag.m.style.left=drag.x+'%';drag.m.style.top=drag.y+'%'});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;d.m.classList.remove('dragging');const pl=curPlan();
  if(d.moved&&d.x!=null){const X=Math.round(d.x*10)/10,Y=Math.round(d.y*10)/10;if(d.side==='ball')pl.ball={x:X,y:Y};else{const arr=d.side==='own'?pl.own:pl.opp;arr[d.i].x=X;arr[d.i].y=Y}save()}
  else if(d.side==='own'){ui.mkSel=ui.mkSel===d.i?null:d.i;applyPlan()}};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{const m=e.target.closest&&e.target.closest('.mk.own');if(m&&isStaff()&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=+m.dataset.i;ui.mkSel=ui.mkSel===i?null:i;applyPlan()}});
const rb=$('#resetBtn');rb.addEventListener('click',()=>{if(!rb.classList.contains('arm')){rb.classList.add('arm');rb.textContent='もう一度押すと初期化します';setTimeout(()=>{rb.classList.remove('arm');rb.textContent='サンプルデータに戻す'},3000);return}
  S=seed();ui.squad='all';S.tacticsBy={};SQ=S.squads.map(q=>q.id);SQ.forEach(q=>S.tacticsBy[q]=seedTactics(q));S.matches=seedMatches();S.life=seedLife();S.fuel=seedFuel();seedMed();initExtras();save();rb.classList.remove('arm');rb.textContent='サンプルデータに戻す';ui.role='s0';ui.view='home';render(true);toast('サンプルデータに戻しました')});
/* 同じブラウザの別タブで開いた画面と同期（スタッフ用と選手用を並べて試せます） */
window.addEventListener('storage',ev=>{if(CLOUD||ev.key!==KEY||!ev.newValue)return;try{const o=JSON.parse(ev.newValue);if(o&&o.v===7&&o.tacticsBy&&o.matches&&o.life&&o.fuel){const typing=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&ui.view!=='chat';S=o;if(!typing)render(false);else renderShell()}}catch(e){}});

function migrate(seeding){
S.staff.forEach(x=>{if(x.medOK===undefined)x.medOK=x.squads==='all'||['監督','トレーナー','クラブ代表'].includes(x.role)});
SQ=S.squads.map(q=>q.id);
try{indexedDB.deleteDatabase('pitchside-videos')}catch(e){}
if(S.matches&&S.matches.some(mt=>mt.videos||mt.memos.some(m=>m.per===undefined))){S.matches.forEach(mt=>{mt.memos.forEach(m=>{if(m.per===undefined){const v=(mt.videos||[]).find(x=>x.id===m.vid);m.per=v&&/後半/.test(v.title)?'後半':v&&/前半/.test(v.title)?'前半':'';if(m.t&&/:/.test(m.t)){const sec=toSec(m.t);m.t=sec==null?'':String(Math.floor(sec/60))}delete m.vid}});delete mt.videos});save()}
if(!S.tacticsBy){S.tacticsBy={};SQ.forEach(q=>S.tacticsBy[q]=seedTactics(q));save()}
if(!S.matches){S.matches=seedMatches();save()}
if(!S.life){S.life=seedLife();save()}
if(!S.fuel){S.fuel=seedFuel();save()}
if(S.players.some(p=>!p.med)){if(!S.medSeeded&&(!CLOUD||seeding)){seedMed()}else S.players.forEach(p=>{if(!p.med)p.med=emptyMed()});S.medSeeded=1;save()}else if(!S.medSeeded){S.medSeeded=1}
if((!CLOUD||seeding||isStaff())&&[...S.players,...S.staff].some(x=>!x.pin)){const R=rng(99);[...S.players,...S.staff].forEach(x=>{if(!x.pin){x.pin=newPin();x.joined=(CLOUD&&!seeding)?null:R()<(x.squad==='A'||x.squads==='all'||(Array.isArray(x.squads)&&x.squads.includes('A'))?.85:.55)?Date.now()-Math.floor(R()*20)*864e5:null}});SQ.forEach(q=>inviteOf(q));save()}
initExtras();
}
function initExtras(){
  if(!S.rules){S.rules=seedRules();S.ruleAck={};S.players.forEach(p=>{if(Math.random()<.7)S.ruleAck[p.id]=Date.now()-864e5*Math.floor(1+Math.random()*15)})}
  if(!S.ruleAck)S.ruleAck={};
  if(!S.cycle)S.cycle=seedCycle();
  if(!S.wbgt)S.wbgt={};
  if(!S.events){const r=seedEvents();S.events=r.ev;S.rsvp=r.rs}
  if(!S.rsvp)S.rsvp={};
  if(!S.x2){S.x2=1;seedLineups();S.messages.forEach(m=>{if(m.imp&&!m.read){const r=rng(m.ts%1000);m.read={};chanPlayers(m.ch).forEach(p=>{if(r()<.72)m.read[p.id]=m.ts+36e5})}});;const p=S.players.find(x=>x.squad==='A'&&!activeInj(x.id)&&x.pos==='DF');if(p){S.injuries.push({id:uid(),pid:p.id,part:'脳しんとう（ヘディングの競り合いで頭部を接触）',detail:'受傷当日に脳神経外科を受診。画像検査は異常なし。頭痛は3日目に消失',start:addDays(TODAY,-6),ret:addDays(TODAY,8),status:'active',cc:true,ccStep:2,ccSince:addDays(TODAY,-1),ccDoc1:true,ccLog:[{d:addDays(TODAY,-6),t:'受傷。脳神経外科を受診'},{d:addDays(TODAY,-3),t:'医師の診察を受けた'},{d:addDays(TODAY,-2),t:'ステップ1「症状が出ない範囲の生活」を開始'},{d:addDays(TODAY,-1),t:'ステップ2「軽い有酸素運動」を開始'}]})}}
  save()}
if(CLOUD){cloudInit();pwaInit()}else{migrate();render(true)}
})();
</script>
